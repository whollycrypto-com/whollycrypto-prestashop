# Optional GitHub Actions template. Copy into .github/workflows/tests.yml yourself.
name: Contract tests
on: [push, pull_request]
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
      - run: php tests/protocol.php
      - run: python3 tests/https-flow.py
      - run: python3 tests/package.py
